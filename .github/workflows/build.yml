name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Restore signing keystore
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > app/release.keystore
            echo "Using the persistent keystore."
          else
            echo "::warning::No KEYSTORE_B64 secret — this APK will not install over a previous build."
            keytool -genkeypair -v \
              -keystore app/release.keystore -storetype PKCS12 \
              -storepass android -keypass android -alias androiddebugkey \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Yaver, OU=Yaver, O=Yaver, L=Phone, S=NA, C=US"
          fi

      - name: Build
        env:
          YAVER_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          YAVER_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          YAVER_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          gradle wrapper --gradle-version=8.2
          chmod +x ./gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Collect APK
        run: |
          echo "--- everything under app/build/outputs ---"
          find app/build/outputs -type f -name '*.apk' -printf '%p  %s bytes\n' || true
          SRC=$(find app/build/outputs -type f -name '*.apk' | head -1)
          if [ -z "$SRC" ]; then
            echo "::error::assembleRelease finished but produced no APK."
            exit 1
          fi
          SHORT=$(echo "${{ github.sha }}" | cut -c1-7)
          cp "$SRC" "Yaver.apk"
          echo "Collected Yaver.apk from $SRC (commit $SHORT)"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: apk
          path: Yaver.apk
          retention-days: 30
          if-no-files-found: error

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Latest Yaver build
          body: |
            Commit `${{ github.sha }}`
            Built ${{ github.run_started_at }}
          files: Yaver.apk
          prerelease: true
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
