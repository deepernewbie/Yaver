plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.plusai.yaver'
    compileSdk 34

    defaultConfig {
        applicationId "com.plusai.yaver"
        minSdk 26
        targetSdk 34
        versionCode 29         // raise this on every release
        versionName "3.6"
    }

    signingConfigs {
        release {
            storeFile     file("${rootProject.projectDir}/app/release.keystore")
            storePassword System.getenv("APP_KEYSTORE_PASSWORD") ?: "android"
            keyAlias      System.getenv("APP_KEY_ALIAS")         ?: "androiddebugkey"
            keyPassword   System.getenv("APP_KEY_PASSWORD")      ?: "android"
        }
    }

    buildTypes {
        release {
            minifyEnabled false      // @JavascriptInterface methods must keep their names
            signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions { jvmTarget = '17' }

    lint {
        checkReleaseBuilds false
        abortOnError false
    }
}

// The repository still holds older versions of yaver (the web-page wrapper in com/plusai/yaver/*.kt and an
// even older app under dev/yaver/). VibeForge never deletes files, so they are left out of the build here.
tasks.withType(org.jetbrains.kotlin.gradle.tasks.KotlinCompile).configureEach {
    exclude('**/dev/yaver/**')
    exclude('**/com/plusai/yaver/*.kt')
    // screens of the first native version, replaced by the interface in assets/app
    exclude('**/com/plusai/yaver/app/MailActivity.kt')
    exclude('**/com/plusai/yaver/app/Screens.kt')
    exclude('**/com/plusai/yaver/app/SettingsActivity.kt')
    exclude('**/com/plusai/yaver/app/Ui.kt')
}

dependencies {
    implementation 'androidx.core:core-ktx:1.12.0'
}
